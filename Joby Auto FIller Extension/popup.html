<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joby Autofill</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 15px;
        width: 300px;
      }
      .form-group {
        margin-bottom: 10px;
      }
      label {
        font-weight: bold;
      }
      input {
        width: 100%;
        padding: 6px;
        margin-top: 4px;
      }
      input[readonly] {
        background-color: #eee;
      }
      button {
        width: 100%;
        padding: 10px;
        background-color: #1a1a1a;
        color: white;
        border: none;
        border-radius: 4px;
        margin-bottom: 10px; /* 👈 add spacing between buttons */
      }
      button:hover {
        background-color: #333;
      }
    </style>
  </head>
  <body>
    <h2>Job Info</h2>
    <div class="form-group">
      <label for="firstName">First Name</label>
      <input
        id="firstName"
        type="text"
        value="Lior"
        placeholder="First Name"
        title="Enter your first name"
      />
    </div>
    <div class="form-group">
      <label for="lastName">Last Name</label>
      <input
        id="lastName"
        type="text"
        value="Rosenberg"
        placeholder="Last Name"
        title="Enter your last name"
      />
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        value="Liorosen96@gmail.com"
        placeholder="Email"
        title="Enter your email address"
      />
    </div>
    <div class="form-group">
      <label for="phone">Phone</label>
      <input
        id="phone"
        type="tel"
        value="0507107715"
        placeholder="Phone"
        title="Enter your phone number"
      />
    </div>
    <div class="form-group">
      <label for="linkedin">LinkedIn</label>
      <input
        id="linkedin"
        type="url"
        value="https://www.linkedin.com/in/lior-rosenberg-b617aa245/"
        placeholder="LinkedIn Profile URL"
        title="Enter your LinkedIn profile URL"
      />
    </div>
    <div class="form-group">
      <label for="website">Website</label>
      <input
        id="website"
        type="url"
        value="https://liorosenberg.pythonanywhere.com/"
        placeholder="Personal website"
        title="Enter your personal website URL"
      />
    </div>
    <div class="form-group">
      <label for="resumeName">Resume File Name</label>
      <input
        id="resumeName"
        type="text"
        value="CV - Lior Rosenberg.pdf"
        readonly
        title="This file will be referenced when highlighting resume upload fields"
      />
    </div>

    <button id="saveButton">Save Information</button>
    <button id="fillButton">Fill Form</button>
    <script src="popup.js"></script>
  </body>
</html>
